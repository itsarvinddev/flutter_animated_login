name: example
description: "Demo gallery for the flutter_animated_login package."
# Prevents the demo from being published to pub.dev by accident.
publish_to: "none"

version: 1.0.0+1

environment:
  # Matches the package: FlutterAnimatedLogin needs Dart 3.6 / Flutter 3.27.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animated_login:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Same lint set as the package itself.
  # A range, not a caret, for the same reason as the package's own pubspec:
  # flutter_lints 6.x needs Dart 3.8, above the Flutter 3.27 floor this
  # example shares with the package, and CI exercises that floor.
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
