name: CI

# The default branch is `main`. This workflow used to trigger on pushes to
# `master`, a branch that has never existed in this repository, so the push
# trigger could never fire -- the Actions API reported `total_count: 0` runs
# across every workflow before this change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Flutter ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `stable` is a CHANNEL, not a version, so it belongs in `channel:`.
          # Leaving `flutter-version` empty is how subosito/flutter-action is
          # told "newest release on this channel" -- its setup.sh turns an
          # empty version into `any`. Putting the word `stable` into
          # `flutter-version` would look for a release literally named
          # "stable" and fail to resolve.
          - label: stable
            channel: stable
            flutter-version: ""
            coverage: true
          # The floor that pubspec.yaml declares (`flutter: ">=3.27.0"`,
          # `sdk: ">=3.6.0"`; Flutter 3.27.0 ships Dart 3.6.0). Pinning it is
          # the only thing that keeps the declared floor honest: without this
          # leg a dependency can quietly raise the real minimum while the
          # pubspec keeps advertising the old one.
          #
          # Previously red here: `flutter_lints: ^6.0.0` needs Dart 3.8,
          # above the declared floor, so `pub get` failed on this leg. The
          # constraint is now `>=5.0.0 <7.0.0`, which resolves to 5.x on 3.6
          # and 6.x on the newest stable. Consumers never resolve
          # dev_dependencies, but the leg has to be installable to be useful.
          - label: 3.27.0 (declared floor)
            channel: stable
            flutter-version: 3.27.0
            coverage: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # The package is formatted at `dart format`'s default 80 columns. The
        # previous `--line-length 120` rewrote 27 of 32 files, so this step
        # could only ever fail. Passing no --line-length asserts the default.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        # Deliberately strict -- no `--no-fatal-infos`. lib/ and test/ produce
        # zero analyzer output today, so an info-level lint here is a real
        # regression and not pre-existing noise to be waved through.
        #
        # Scoped to lib/ and test/ on purpose: a bare `flutter analyze` from
        # the repository root also walks example/, which the `example` job
        # below analyses properly, against the example's own pubspec and
        # analysis_options.
        run: flutter analyze lib test

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: flutter test

      - name: Run tests with coverage
        # Coverage on a single leg: the two legs run the same suite, so
        # collecting it twice buys nothing.
        if: ${{ matrix.coverage }}
        run: flutter test --coverage

      - name: Upload coverage
        # Kept as a build artifact rather than pushed to a coverage service:
        # this repository has no coverage-service token configured, and a step
        # that silently no-ops without its secret is worse than no step.
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  example:
    name: Example app
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze example
        # Strict here too. The example was the one place that still produced
        # analyzer output (an `avoid_print` in the demo), which is why the old
        # CI needed `--no-fatal-infos`; it is clean as of 1.0.0, so there is
        # nothing left to excuse. If a demo ever does need to print, add a
        # scoped `// ignore: avoid_print` rather than reopening this gate for
        # the whole example.
        run: flutter analyze
        working-directory: example

      - name: Test example
        run: flutter test
        working-directory: example

  score:
    name: Publish dry-run and pana score
    runs-on: ubuntu-latest
    env:
      # Minimum pana score the package must keep. Measured 150/160 with pana
      # 0.23.19 on 2026-09-12; the 10 missing points are "Failed to verify
      # repository URL", which resolves itself once a pubspec.yaml carrying
      # the corrected `repository:` field is on the default branch. Raise this
      # to 160 after v1.0.0 lands on main so the full score is defended.
      MIN_PANA_SCORE: "150"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        # Flutter, not dart-lang/setup-dart: pana and `pub publish` both have
        # to resolve `flutter`/`flutter_test` from the SDK, which a standalone
        # Dart SDK cannot provide. flutter-action puts `dart` on PATH too.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish dry run
        # Exits 0 only when the package has zero warnings, so this catches a
        # broken pubspec, a missing licence and an oversized archive before a
        # tag is ever cut.
        run: dart pub publish --dry-run

      - name: Install pana
        run: dart pub global activate pana

      - name: Score with pana
        run: |
          set -euo pipefail
          dart pub global run pana --no-warning --json . > pana.json

          granted=$(jq -r '.scores.grantedPoints' pana.json)
          max=$(jq -r '.scores.maxPoints' pana.json)

          echo "pana score: $granted / $max (gate: >= $MIN_PANA_SCORE)"
          jq -r '.report.sections[]
                 | "  \(.grantedPoints)/\(.maxPoints)  \(.title)"' pana.json

          {
            echo "### pana score: $granted / $max"
            echo
            echo "Gate: >= $MIN_PANA_SCORE"
            echo
            jq -r '.report.sections[]
                   | "- \(.grantedPoints)/\(.maxPoints) \(.title)"' pana.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$granted" -lt "$MIN_PANA_SCORE" ]; then
            echo "::error::pana score $granted/$max is below the gate of $MIN_PANA_SCORE"
            echo "Sections that lost points:"
            jq -r '.report.sections[]
                   | select(.grantedPoints < .maxPoints)
                   | .summary' pana.json
            exit 1
          fi
