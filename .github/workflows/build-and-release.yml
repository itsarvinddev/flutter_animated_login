name: Build & Release

# Deploys the live demo at https://itsarvinddev.github.io/flutter_animated_login/.
#
# This used to run on every `pull_request`, which published whatever a pull
# request happened to contain straight to the public demo -- including from
# forks. It also listed `master` and `develop`, neither of which exists here.
# Now only a push to the default branch deploys, plus a manual run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing each other onto gh-pages leaves the site in whichever
# state finishes last, so let the newer one win and do not cancel a deploy
# that is already pushing.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./example

      - name: Build Web Project
        run: flutter build web --release --base-href /flutter_animated_login/
        working-directory: ./example

      - name: Fix PWA
        run: sed -i'.js' -e 's+"/"+""+g' flutter_service_worker.js #https://github.com/flutter/flutter/issues/68449
        working-directory: ./example/build/web

      - name: Deploy web To GH-Page
        uses: peaceiris/actions-gh-pages@v3
        with:
          # The job's own token, allowed to push by `permissions: contents:
          # write` above. The PERSONAL_TOKEN secret this used before was
          # rejected ("Invalid username or token"), which failed every deploy
          # of the 1.0.0 demo. GitHub Pages is set to the legacy gh-pages
          # branch source, which this action publishes to.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./example/build/web
